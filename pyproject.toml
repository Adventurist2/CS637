[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sequin-grid"
version = "0.1.0"
description = "Independent, open-source-solver implementation of sequential grid contingency analysis"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scipy>=1.13,<2", "networkx>=3.3,<4", "highspy>=1.9,<2", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
reproduction = ["gurobipy==12.0.3", "pandas==3.1.0"]

[project.scripts]
sequin = "sequin.cli:main"

[tool.setuptools.packages.find]
include = ["sequin*"]

[tool.setuptools.package-data]
sequin = ["data/cases/*.m", "data/PROVENANCE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=tmp/pytest"
